services:
  postgres:
    image: postgres:16-alpine
    container_name: readinn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: readinn
      POSTGRES_USER: readinn
      POSTGRES_PASSWORD: readinn_dev_password
    ports:
      - "5432:5432"
    volumes:
      - readinn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readinn -d readinn"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: readinn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: readinn
      MINIO_ROOT_PASSWORD: readinn_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - readinn-minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: readinn-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  readinn-postgres-data:
  readinn-minio-data:
